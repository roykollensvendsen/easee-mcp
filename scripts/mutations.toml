# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/easee_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "the library never logs"
file = "src/easee_mcp/adapter.py"
find = 'logging.getLogger\(_library\).setLevel\(logging.CRITICAL \+ 1\)'
replace = 'logging.getLogger(_library).setLevel(logging.NOTSET)'

[[rule]]
name = "a 429 is never retried"
file = "src/easee_mcp/adapter.py"
find = 'raise SlowDownError\(_wait\(slow\)\) from None'
replace = 'continue'

[[rule]]
name = "the state is read at most every thirty seconds"
file = "src/easee_mcp/cache.py"
find = '"reading", STATE_SECONDS, "state", lambda: self._reader.reading\(charger.id\)'
replace = '"reading", 0, "state", lambda: self._reader.reading(charger.id)'

[[rule]]
name = "a 429 stops calls until retry after passes"
file = "src/easee_mcp/cache.py"
find = 'if until is not None and now < until:'
replace = 'if False:'

[[rule]]
name = "sessions are read at most ten times an hour"
file = "src/easee_mcp/cache.py"
find = 'if len\(recent\) >= allowed:'
replace = 'if False:'

[[rule]]
name = "a charger name is said as one short line"
file = "src/easee_mcp/answers.py"
find = 'flat = " ".join\(_CONTROL.sub\(" ", name\).split\(\)\)\[:NAME_MAX\].strip\(\)'
replace = 'flat = name'

[[rule]]
name = "an unknown period is asked about never guessed"
file = "src/easee_mcp/answers.py"
find = 'if period not in PERIODS:'
replace = 'if False:'

[[rule]]
name = "every tool answers with a sentence even when it fails"
file = "src/easee_mcp/server.py"
find = 'except Exception as failure:  # noqa: BLE001 - whatever broke, the voice gets a sentence'
replace = 'except ZeroDivisionError as failure:'
